<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>My Favorite Films</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/css/bootstrap.min.css">

    <link href="styles.css" rel="stylesheet">

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <span class="navbar-brand">My Favorite Films</span>
</nav>

<main class="container mt-4">

    <h2 class="mb-4">My four favorite films from Letterboxd</h2>

    <div class="row">

        <!-- The Thing -->
        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card movie-card" onclick="showSynopsis('thing')">
                <img src="posters/thing.jpg" class="card-img-top" alt="The Thing">
            </div>
        </div>

        <!-- Deep Red -->
        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card movie-card" onclick="showSynopsis('deepred')">
                <img src="posters/deepred.jpg" class="card-img-top" alt="Deep Red">
            </div>
        </div>

        <!-- Apocalypse Now -->
        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card movie-card" onclick="showSynopsis('apocalypse')">
                <img src="posters/apocalypse.jpg" class="card-img-top" alt="Apocalypse Now">
            </div>
        </div>

        <!-- Dazed and Confused -->
        <div class="col-md-3 col-sm-6 mb-4">
            <div class="card movie-card" onclick="showSynopsis('dazed')">
                <img src="posters/dazed.jpg" class="card-img-top" alt="Dazed and Confused">
            </div>
        </div>

    </div>

    <div id="synopsis" class="mt-4 p-3">
        <p>Click a movie poster to see the synopsis.</p>
    </div>

</main>

<script>
function showSynopsis(movie) {
    let text = "";

    if (movie === "thing") {
        text = "<strong>The Thing (1982)</strong><br>A research team in Antarctica is hunted by a shape-shifting alien that assumes the appearance of its victims.";
    }
    else if (movie === "deepred") {
        text = "<strong>Deep Red (1975)</strong><br>An English pianist living in Rome witnesses the brutal murder of his psychic neighbor. With the help of a tenacious young reporter, he tries to discover the killer using very unconventional methods. The two are soon drawn into a shocking web of dementia and violence.";
    }
    else if (movie === "apocalypse") {
        text = "<strong>Apocalypse Now (1979)</strong><br>At the height of the Vietnam war, Captain Benjamin Willard is sent on a dangerous mission that, officially, “does not exist, nor will it ever exist.” His goal is to locate - and eliminate - a mysterious Green Beret Colonel named Walter Kurtz, who has been leading his personal army on illegal guerrilla missions into enemy territory.";
    }
    else if (movie === "dazed") {
        text = "<strong>Dazed and Confused (1993)</strong><br>The adventures of a group of Texas teens on their last day of school in 1976, centering on student Randall Floyd, who moves easily among stoners, jocks and geeks. Floyd is a star athlete, but he also likes smoking weed, which presents a conundrum when his football coach demands he sign a “no drugs” pledge.";
    }

    document.getElementById("synopsis").innerHTML = text;
}
</script>

</body>
</html>
